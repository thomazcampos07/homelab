services:
  # Mantem o subdominio DuckDNS apontando para o IP publico da casa, que a
  # operadora troca sem aviso. Sem isso, a VPN para de ser encontrada.
  duckdns:
    container_name: duckdns
    image: lscr.io/linuxserver/duckdns:83618c17-ls90
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Sao_Paulo
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN}
      TOKEN: ${DUCKDNS_TOKEN}
      UPDATE_IP: ipv4
    restart: unless-stopped

  wireguard:
    container_name: wireguard
    image: lscr.io/linuxserver/wireguard:1.0.20260223
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Sao_Paulo
      # Endereco pelo qual os clientes encontram o servidor. Precisa ser DDNS:
      # o IP publico da operadora e dinamico e muda sem aviso.
      SERVERURL: ${DDNS_DOMAIN}
      SERVERPORT: "51820"
      # Um arquivo de configuracao (e QR code) e gerado por nome listado aqui.
      PEERS: ${WG_PEERS}
      # DNS dos clientes aponta para o Pi-hole: e isso que leva o bloqueio de
      # anuncios para fora de casa.
      PEERDNS: 192.168.15.5
      INTERNAL_SUBNET: 10.13.13.0
      # Todo o trafego do cliente passa pelo tunel. Sem isso, so a rede local
      # seria alcancada e o DNS filtrado nao valeria para a navegacao.
      ALLOWEDIPS: 0.0.0.0/0
    volumes:
      - ./config:/config
      - /lib/modules:/lib/modules:ro
      # Regras de firewall aplicadas a cada inicializacao (peer do deploy so
      # alcanca o SSH do Pi)
      - ./custom-init:/custom-cont-init.d:ro
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
