# Avisa (via PR) quando sai versao nova das imagens pinadas nos composes e das
# actions usadas nos workflows. O merge do PR dispara o deploy no Pi
# (.github/workflows/deploy.yml).
version: 2
updates:
  - package-ecosystem: "docker-compose"
    directories:
      - "/pihole"
      - "/wireguard"
      - "/beszel"
      - "/backup"
    schedule:
      interval: "weekly"
      day: "saturday"
      timezone: "America/Sao_Paulo"
    commit-message:
      prefix: "Atualiza imagem"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      timezone: "America/Sao_Paulo"
    commit-message:
      prefix: "Atualiza action"
