server:
    verbosity: 0
    interface: 0.0.0.0
    port: 53

    # Necessario em container: sem isso o unbound faz fork, o processo
    # principal termina e o container morre com exit 0. A imagem e distroless
    # e chama o binario direto, entao nao ha supervisor para segurar o processo.
    do-daemonize: no
    username: ""
    chroot: ""
    directory: "/etc/unbound"
    logfile: ""
    use-syslog: no

    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    # O Pi nao tem IPv6 ativo na LAN; habilitar so geraria timeouts.
    do-ip6: no
    prefer-ip6: no

    # Aceita apenas o proprio host e a rede interna do Docker (por onde o
    # Pi-hole chega). Resolver recursivo aberto para a LAN pode ser abusado
    # em ataques de amplificacao.
    access-control: 127.0.0.1/32 allow
    access-control: 172.16.0.0/12 allow

    # Nao aceita respostas que apontem para faixas privadas (rebind attack).
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10

    # Trust anchor da raiz DNSSEC. O arquivo fica em volume gravavel porque o
    # unbound reverifica e atualiza a chave periodicamente (RFC 5011).
    auto-trust-anchor-file: "/etc/unbound/keys/root.key"
    val-clean-additional: yes

    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    use-caps-for-id: no
    edns-buffer-size: 1232

    # Cache dimensionado para um Pi de 1 GB: ~48 MB no total.
    msg-cache-size: 16m
    rrset-cache-size: 32m
    cache-min-ttl: 300
    cache-max-ttl: 86400
    prefetch: yes

    num-threads: 1
    so-rcvbuf: 1m

    hide-identity: yes
    hide-version: yes
