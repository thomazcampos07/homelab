services:
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.09.0
    network_mode: host
    environment:
      TZ: America/Sao_Paulo
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_upstreams: 127.0.0.1#5335
      FTLCONF_dns_listeningMode: LOCAL
      FTLCONF_dns_interface: wlan0
      FTLCONF_ntp_ipv4_active: "false"
      FTLCONF_ntp_ipv6_active: "false"
      FTLCONF_database_maxDBdays: "30"
    volumes:
      - ./etc-pihole:/etc/pihole
    restart: unless-stopped
    depends_on:
      - unbound

  unbound:
    container_name: unbound
    image: klutchell/unbound:v1.26.1
    # Publicado apenas em 127.0.0.1: o Pi-hole alcanca pelo host, mas a LAN
    # nao enxerga. Resolver recursivo exposto vira vetor de amplificacao.
    ports:
      - "127.0.0.1:5335:53/udp"
      - "127.0.0.1:5335:53/tcp"
    volumes:
      - ./unbound/unbound.conf:/etc/unbound/unbound.conf:ro
      # Gravavel: o unbound atualiza o trust anchor sozinho (RFC 5011).
      - ./unbound/keys:/etc/unbound/keys
    restart: unless-stopped
